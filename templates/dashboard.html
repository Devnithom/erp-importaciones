{% extends 'base.html' %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6 border-l-4 border-white pl-3">Resumen de Operaciones</h1>
    
    <!-- Tarjetas de métricas rápidas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-lg shadow-lg">
            <h2 class="text-gray-400 text-sm uppercase tracking-wider">Total Productos (Modelos)</h2>
            <p class="text-4xl font-bold text-white mt-2">{{ total_productos }}</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 p-6 rounded-lg shadow-lg">
            <h2 class="text-gray-400 text-sm uppercase tracking-wider">Stock Físico Total</h2>
            <p class="text-4xl font-bold text-white mt-2">{{ total_stock }}</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 p-6 rounded-lg shadow-lg">
            <h2 class="text-gray-400 text-sm uppercase tracking-wider">Ventas Acumuladas</h2>
            <p class="text-4xl font-bold text-green-400 mt-2">S/ {{ total_ventas }}</p>
        </div>

    </div>
{% endblock %}
