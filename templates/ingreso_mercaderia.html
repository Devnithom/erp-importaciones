{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-gray-900 border border-gray-800 rounded-lg p-8 shadow-lg mt-10">
    <h1 class="text-2xl font-bold text-white mb-6 border-l-4 border-green-500 pl-3">Registrar Ingreso de Mercadería</h1>
    
    <form method="POST" action="">
        {% csrf_token %} <!-- Medida de seguridad obligatoria de Django -->
        
        <div class="space-y-4">
            <div>
                <label class="text-gray-400 text-sm font-bold uppercase tracking-wide">Producto</label>
                {{ form.producto }}
            </div>
            
            <div>
                <label class="text-gray-400 text-sm font-bold uppercase tracking-wide">Almacén / Taller Destino</label>
                {{ form.ubicacion }}
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-gray-400 text-sm font-bold uppercase tracking-wide">Cantidad</label>
                    {{ form.cantidad }}
                </div>
                <div>
                    <label class="text-gray-400 text-sm font-bold uppercase tracking-wide">Motivo / Origen</label>
                    {{ form.motivo }}
                </div>
            </div>
        </div>

        <div class="mt-8 flex justify-end gap-4">
            <a href="/catalogo/" class="bg-gray-800 text-white font-bold py-2 px-6 rounded hover:bg-gray-700 transition">Cancelar</a>
            <button type="submit" class="bg-green-600 text-white font-bold py-2 px-6 rounded hover:bg-green-500 transition">
                Guardar Ingreso
            </button>
        </div>
    </form>
</div>
{% endblock %}
