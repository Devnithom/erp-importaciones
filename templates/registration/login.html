<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | ERP Importaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #f3f4f6; }
    </style>
</head>
<body class="font-sans antialiased h-screen flex items-center justify-center">

    <div class="bg-gray-900 border border-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-widest text-white mb-2">SISTEMA ERP</h1>
            <p class="text-gray-500 text-sm">Control de Inventario y Ventas</p>
        </div>

        {% if form.errors %}
            <div class="bg-red-900 border border-red-500 text-red-200 px-4 py-3 rounded mb-6 text-sm font-bold text-center">
                El usuario o la contraseña son incorrectos.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="mb-5">
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wide mb-2" for="id_username">Usuario</label>
                <!-- Inyectamos Tailwind en los campos automáticos de Django -->
                <input type="text" name="username" id="id_username" class="w-full bg-gray-800 text-white border border-gray-700 rounded px-4 py-3 focus:outline-none focus:border-blue-500 transition shadow-inner" required autofocus>
            </div>
            
            <div class="mb-8">
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wide mb-2" for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" class="w-full bg-gray-800 text-white border border-gray-700 rounded px-4 py-3 focus:outline-none focus:border-blue-500 transition shadow-inner" required>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-500 transition duration-300 uppercase tracking-wider">
                Ingresar al Sistema
            </button>
            
            <!-- Django necesita este campo oculto para saber a dónde mandarte después de loguearte -->
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
        </form>
        
    </div>

</body>
</html>
